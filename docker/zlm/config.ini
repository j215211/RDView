; ZLMediaKit 配置 — 局域网最小可用版
; 详细配置参考: https://github.com/ZLMediaKit/ZLMediaKit/wiki

[api]
; 提供给后端调用的 API secret
secret=rdview_zlm_secret
apiDebug=1
defaultSnap=./www/snap/default.jpg
snapRoot=./www/snap/

[general]
mediaServerId=rdview
maxStreamWaitMS=15000
streamNoneReaderDelayMS=20000
; 转 H264/H265 时使用的码率,默认即可
enableVhost=0

[http]
port=8080
keepAliveSecond=30

[rtsp]
port=554
authBasic=0

[rtmp]
port=1935

[webrtc]
; WebRTC 信令端口走 HTTP API,媒体走 UDP
externIP=
udpMinPort=10000
udpMaxPort=10100

[hook]
; 流注册/注销时回调后端,用于状态同步
enable=1
on_stream_changed=http://host.docker.internal:3000/api/internal/zlm/on_stream_changed
on_stream_none_reader=http://host.docker.internal:3000/api/internal/zlm/on_stream_none_reader
on_stream_not_found=http://host.docker.internal:3000/api/internal/zlm/on_stream_not_found
timeoutSec=20
